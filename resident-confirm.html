<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarangayAssist — Confirmation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body{padding:40px 16px;}
  .single-caption{text-align:center; font-size:13px; color:var(--sub); font-weight:700; margin-bottom:18px; text-transform:uppercase; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="single-caption">Screen — Confirmation</div>
<div class="phone-frame-wrap">

    <div class="notch"></div>
    <div class="screen active" id="s-confirm">
          <div class="ph-header simple"><div class="back-btn">←</div><div style="font-weight:700; font-size:15px;">Request Submitted</div></div>

            <h3>Request received!</h3>
            <p>Your Barangay Clearance request has been submitted. You'll get a notification once it's ready for pickup.</p>
            <div class="ref">Reference No. BA-2024-0128</div>
          </div>
        </div>
    
  </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarangayAssist — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body{padding:40px 16px;}
  .single-caption{text-align:center; font-size:13px; color:var(--sub); font-weight:700; margin-bottom:18px; text-transform:uppercase; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="single-caption">Screen — Login</div>
<div class="phone-frame-wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen active" id="s-login">
          <div class="login-wrap">
            <div class="login-logo">🏠</div>
            <div class="login-title">Welcome to BarangayAssist</div>
            <div class="login-sub">Brgy. San Isidro, City of Sampaguita</div>
            <div class="login-card">
              <div class="field"><label>Mobile Number or Email</label><input type="text" placeholder="09XX XXX XXXX"></div>
              <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
              <button class="login-btn">Log In</button>
              <div class="login-alt">Don't have an account? <a href="resident-register.html">Register</a></div>
            </div>
          </div>
        </div>
    
  </div>
</div>
</body>
</html>

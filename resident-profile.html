<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarangayAssist — Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body{padding:40px 16px;}
  .single-caption{text-align:center; font-size:13px; color:var(--sub); font-weight:700; margin-bottom:18px; text-transform:uppercase; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="single-caption">Screen — Profile</div>
<div class="phone-frame-wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen active" id="s-profile">
          <div class="profile-top">
            <div class="avatar">JD</div>
            <div class="pname">Juan Dela Cruz</div>
            <div class="paddr">Brgy. San Isidro · Purok 3</div>
          </div>
          <div class="profile-card">
            <div class="prof-item"><div class="ic">👤</div><span>Edit Profile</span><div class="chev">›</div></div>
            <div class="prof-item"><div class="ic">🔔</div><span>Notifications</span><div class="chev">›</div></div>
            <div class="prof-item"><div class="ic">📄</div><span>My Documents</span><div class="chev">›</div></div>

            <div class="prof-item danger"><div class="ic">🚪</div><span>Log Out</span><div class="chev">›</div></div>
          </div>
        </div>
    <div class="navbar" id="res-navbar">
      <div class="nitem "><span class="nic">🏠</span>Home</div>
      <div class="nitem "><span class="nic">📄</span>Requests</div>
      <div class="nitem "><span class="nic">📊</span>Reports</div>
      <div class="nitem on"><span class="nic">👤</span>Profile</div>
    </div>
  </div>
</div>

</html>
